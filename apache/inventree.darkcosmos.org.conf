# Apache virtual host for InvenTree (inventree.darkcosmos.org)
#
# Modelled on the spacegravity.org vhost: Apache terminates TLS and reverse-proxies
# to the bundled Caddy container published on loopback (see docker-compose.override.yml).
#
# Enable the required modules first:
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers ssl rewrite
#
# Obtain the TLS certificate BEFORE enabling this site (the 443 block references a cert
# that does not exist yet, so enabling it first breaks `apache2ctl configtest`). Use
# `certonly` so certbot does not rewrite this vhost:
#   sudo certbot certonly --apache -d inventree.darkcosmos.org
#
# Then enable the site and reload:
#   sudo a2ensite inventree.darkcosmos.org
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName inventree.darkcosmos.org
    # Redirect all HTTP to HTTPS
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =inventree.darkcosmos.org
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost _default_:443>
    ServerName inventree.darkcosmos.org
    ServerAdmin webmaster@darkcosmos.org

    ProxyPreserveHost On

    # Tell InvenTree the original request was HTTPS (it sits behind two proxies)
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # Allow large uploads (part attachments etc.)
    LimitRequestBody 0

    # WebSocket upgrade (live notifications) -> same backend
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:8087/$1" [P,L]

    ProxyPass        / http://127.0.0.1:8087/
    ProxyPassReverse / http://127.0.0.1:8087/

    ErrorLog  ${APACHE_LOG_DIR}/inventree.darkcosmos.org_error.log
    CustomLog ${APACHE_LOG_DIR}/inventree.darkcosmos.org_access.log combined

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/inventree.darkcosmos.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/inventree.darkcosmos.org/privkey.pem
</VirtualHost>
</IfModule>
